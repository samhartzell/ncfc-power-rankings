name: Refresh rankings

on:
  schedule:
    # 11:00 UTC daily -- early morning Eastern, so Sunday's results are in by Monday.
    - cron: "0 11 * * *"
  push:
    # Scheduled runs always use the default branch whatever it is called;
    # this trigger just rebuilds the page as soon as the code changes.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-rankings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run checks
        run: python3 -m unittest discover -s tests -v

      - name: Fetch results and rebuild
        run: python3 scripts/build.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- index.html data/rankings.json; then
            echo "No change in results; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/rankings.json
          git commit -m "Refresh rankings"
          git push

      # Creating a Pages site needs more than the Actions token carries, so
      # Pages has to be switched on once by hand. Until that happens the
      # publish steps are skipped rather than failing the refresh, and the
      # run leaves a notice saying what to do.
      - name: Check whether Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not enabled, so the page was not published. Turn it on at Settings > Pages with Source: GitHub Actions. The rankings data was still refreshed."
          fi

      - name: Configure Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
